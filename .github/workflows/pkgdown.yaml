on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # R, Quarto, pandoc, and binary CRAN packages (r2u) come with the image.
    container:
      image: ghcr.io/dukestatsci/r_gh_actions:latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # An unoptimized build is enough to render the site and much faster
      # than the release profile's LTO build.
      DEBUG: 1
      # Incremental artifacts only help local rebuilds and bloat the cache.
      CARGO_INCREMENTAL: 0
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable
        id: rust

      # A debug install leaves src/rust/target in place, so caching it lets
      # cargo reuse the compiled dependencies and rebuild only creditor.
      - uses: actions/cache@v4
        with:
          path: src/rust/target
          key: pkgdown-cargo-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('src/rust/Cargo.lock') }}
          restore-keys: pkgdown-cargo-${{ steps.rust.outputs.cachekey }}-

      - name: Install dependencies
        run: |
          install.packages(c("pkgdown", "remotes"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}

      - name: Install creditor
        run: R CMD INSTALL --no-test-load .

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          # Removes pages for renamed or deleted topics. Revert to clean: false
          # if versioned (dev and release) docs are ever added.
          clean: true
          branch: gh-pages
          folder: docs
