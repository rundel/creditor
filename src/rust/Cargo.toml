[package]
name = 'creditor'
publish = false
version = '0.1.0'
edition = '2024'
rust-version = '1.85'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'creditor'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
serde_json = '1'

[dependencies.loro]
version = '1.18'
features = [ 'jsonpath' ]

[profile.release]
lto = true
codegen-units = 1
